[project]
name = "mlai"
version = "0.1.0"
description = "Robustezza e Verifica Formale di Reti Neurali su GTSRB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "maraboupy>=2.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "onnxscript>=0.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.20.0",
]
